<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smart Traffic System</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --surface2: #181c22;
    --border: #222831;
    --accent: #f0b429;
    --accent2: #e05252;
    --green: #34d399;
    --text: #e8eaf0;
    --muted: #6b7280;
    --font-display: 'Bebas Neue', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-body: 'IBM Plex Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Grid bg ── */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(240,180,41,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,180,41,.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* ── Header ── */
  header {
    position: relative; z-index: 1;
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
    background: rgba(10,12,15,.9);
    backdrop-filter: blur(10px);
  }
  .logo { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: 2px; color: var(--accent); }
  .logo span { color: var(--text); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    display: inline-block; margin-right: 8px;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .status-text { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }

  /* ── Stats bar ── */
  .stats-bar {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .stat {
    padding: 1.2rem 2rem;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat-label { font-family: var(--font-mono); font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-family: var(--font-display); font-size: 2rem; letter-spacing: 1px; margin-top: 4px; }
  .stat-value.yellow { color: var(--accent); }
  .stat-value.red { color: var(--accent2); }
  .stat-value.green { color: var(--green); }

  /* ── Layout ── */
  .layout {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 420px 1fr;
    min-height: calc(100vh - 130px);
  }

  /* ── Left Panel: Form ── */
  .panel-left {
    border-right: 1px solid var(--border);
    padding: 2rem;
    background: var(--surface);
  }
  .panel-title {
    font-family: var(--font-display); font-size: 1.4rem; letter-spacing: 2px;
    color: var(--accent); margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border); padding-bottom: .8rem;
  }

  .field { margin-bottom: 1.2rem; }
  label { display: block; font-family: var(--font-mono); font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  input[type=text], input[type=number] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono); font-size: .9rem;
    padding: .7rem 1rem;
    border-radius: 4px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: #3a3f48; }

  .checkbox-row {
    display: flex; align-items: center; gap: .7rem;
    background: var(--bg); border: 1px solid var(--border);
    padding: .7rem 1rem; border-radius: 4px;
    cursor: pointer;
  }
  .checkbox-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent2); cursor: pointer; }
  .checkbox-row span { font-family: var(--font-mono); font-size: .85rem; color: var(--muted); }

  .btn-submit {
    width: 100%; padding: .9rem;
    background: var(--accent);
    border: none; border-radius: 4px;
    color: #0a0c0f;
    font-family: var(--font-display); font-size: 1.2rem; letter-spacing: 2px;
    cursor: pointer;
    transition: transform .1s, box-shadow .2s;
    margin-top: .5rem;
  }
  .btn-submit:hover { box-shadow: 0 0 20px rgba(240,180,41,.3); }
  .btn-submit:active { transform: scale(.98); }
  .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Result box ── */
  .result-box {
    margin-top: 1.5rem;
    padding: 1rem 1.2rem;
    border-radius: 4px;
    font-family: var(--font-mono); font-size: .8rem; line-height: 1.6;
    display: none;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  .result-box.violation {
    background: rgba(224,82,82,.1); border: 1px solid rgba(224,82,82,.4);
    color: #fca5a5;
  }
  .result-box.clean {
    background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.4);
    color: var(--green);
  }
  .result-box.error {
    background: rgba(107,114,128,.1); border: 1px solid var(--border);
    color: var(--muted);
  }

  /* ── Right Panel: History ── */
  .panel-right { padding: 2rem; overflow: hidden; }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.2rem;
    border-bottom: 1px solid var(--border); padding-bottom: .8rem;
  }
  .search-wrap { display: flex; gap: .5rem; }
  .search-input {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font-mono); font-size: .8rem;
    padding: .5rem .8rem; border-radius: 4px; outline: none; width: 200px;
    transition: border-color .2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .btn-sm {
    padding: .5rem .9rem; border-radius: 4px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted);
    font-family: var(--font-mono); font-size: .75rem; cursor: pointer;
    transition: all .2s;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm.danger:hover { border-color: var(--accent2); color: var(--accent2); }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 240px); }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-family: var(--font-mono); font-size: .65rem; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); padding: .7rem 1rem;
    text-align: left; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 1;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background .15s;
  }
  tbody tr:hover { background: var(--surface); }
  tbody tr.selected { background: rgba(240,180,41,.06); border-color: rgba(240,180,41,.2); }
  td {
    font-family: var(--font-mono); font-size: .78rem;
    padding: .75rem 1rem; color: var(--text);
  }
  td.id { color: var(--muted); }
  td.speed { color: var(--accent); font-weight: 600; }
  td.fine { color: var(--accent2); font-weight: 600; }
  td.vehicle { color: var(--text); letter-spacing: .5px; }
  .badge {
    display: inline-block; padding: .15rem .5rem; border-radius: 3px;
    font-size: .65rem; letter-spacing: .5px;
    background: rgba(224,82,82,.15); color: var(--accent2); border: 1px solid rgba(224,82,82,.3);
  }
  .empty-state {
    text-align: center; padding: 4rem;
    font-family: var(--font-mono); font-size: .85rem; color: var(--muted);
  }
  .empty-state .icon { font-size: 3rem; display: block; margin-bottom: 1rem; opacity: .3; }

  /* ── Loading spinner ── */
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .6s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .panel-left { border-right: none; border-bottom: 1px solid var(--border); }
    .stats-bar { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">TRAFFIC<span>SYS</span></div>
  <div><span class="status-dot"></span><span class="status-text">SYSTEM ONLINE</span></div>
</header>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-label">Total Violations</div>
    <div class="stat-value red" id="stat-violations">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Total Fines Issued</div>
    <div class="stat-value yellow" id="stat-fines">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Speed Threshold</div>
    <div class="stat-value green">80 km/h</div>
  </div>
</div>

<div class="layout">

  <!-- LEFT: Process Event -->
  <div class="panel-left">
    <div class="panel-title">PROCESS EVENT</div>

    <div class="field">
      <label>Vehicle ID</label>
      <input type="text" id="vehicleId" placeholder="e.g. MH12AB1234"/>
    </div>
    <div class="field">
      <label>Speed (km/h)</label>
      <input type="number" id="speed" placeholder="e.g. 95" min="0" max="300"/>
    </div>
    <div class="field">
      <label>Zone</label>
      <input type="text" id="zone" placeholder="e.g. PUNE"/>
    </div>
    <div class="field">
      <label>Vehicle Type</label>
      <label class="checkbox-row" style="cursor:pointer">
        <input type="checkbox" id="emergency"/>
        <span>Emergency Vehicle (exempt from fines)</span>
      </label>
    </div>

    <button class="btn-submit" id="processBtn" onclick="processEvent()">PROCESS EVENT</button>

    <div class="result-box" id="resultBox"></div>
  </div>

  <!-- RIGHT: Violation History -->
  <div class="panel-right">
    <div class="panel-header">
      <div class="panel-title" style="margin:0;border:none;padding:0">VIOLATION LOG</div>
      <div class="search-wrap">
        <input class="search-input" id="searchInput" placeholder="Search vehicle ID..." onkeydown="if(event.key==='Enter')searchViolations()"/>
        <button class="btn-sm" onclick="searchViolations()">Search</button>
        <button class="btn-sm" onclick="loadViolations()">↺ Refresh</button>
        <button class="btn-sm danger" onclick="deleteSelected()">Delete</button>
      </div>
    </div>

    <div class="table-wrap">
      <table id="violationTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Vehicle ID</th>
            <th>Speed</th>
            <th>Zone</th>
            <th>Fine</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6"><div class="empty-state"><span class="spinner"></span></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API = '/api';
  let selectedId = null;

  // ── Load Stats ──────────────────────────────────────────────────────────────
  async function loadStats() {
    try {
      const r = await fetch(`${API}/stats`);
      const d = await r.json();
      document.getElementById('stat-violations').textContent = d.totalViolations.toLocaleString();
      document.getElementById('stat-fines').textContent = '₹' + d.totalFines.toLocaleString();
    } catch(e) {}
  }

  // ── Load Violations ─────────────────────────────────────────────────────────
  async function loadViolations() {
    selectedId = null;
    document.getElementById('searchInput').value = '';
    try {
      const r = await fetch(`${API}/violations`);
      const data = await r.json();
      renderTable(data);
    } catch(e) {
      renderError();
    }
    loadStats();
  }

  async function searchViolations() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) { loadViolations(); return; }
    try {
      const r = await fetch(`${API}/violations/search?q=${encodeURIComponent(q)}`);
      renderTable(await r.json());
    } catch(e) { renderError(); }
  }

  function renderTable(rows) {
    const tbody = document.getElementById('tableBody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><span class="icon">🚦</span>No violations found.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(v => `
      <tr onclick="selectRow(this, ${v.id})" data-id="${v.id}">
        <td class="id">#${v.id}</td>
        <td class="vehicle">${v.vehicleId}</td>
        <td class="speed">${v.speed.toFixed(1)} km/h</td>
        <td><span class="badge">${v.zone}</span></td>
        <td class="fine">₹${v.fine.toLocaleString()}</td>
        <td style="color:var(--muted);font-size:.72rem">${new Date(v.timestamp).toLocaleString('en-IN')}</td>
      </tr>
    `).join('');
  }

  function renderError() {
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="6"><div class="empty-state">Failed to load data.</div></td></tr>`;
  }

  function selectRow(tr, id) {
    document.querySelectorAll('tbody tr').forEach(r => r.classList.remove('selected'));
    if (selectedId === id) { selectedId = null; return; }
    tr.classList.add('selected');
    selectedId = id;
  }

  // ── Process Event ───────────────────────────────────────────────────────────
  async function processEvent() {
    const btn = document.getElementById('processBtn');
    const box = document.getElementById('resultBox');
    const vehicleId = document.getElementById('vehicleId').value.trim();
    const speed = parseFloat(document.getElementById('speed').value);
    const zone = document.getElementById('zone').value.trim();
    const emergency = document.getElementById('emergency').checked;

    if (!vehicleId || !zone || isNaN(speed)) {
      showResult('error', '⚠ Please fill in all fields correctly.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    try {
      const r = await fetch(`${API}/process`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ vehicleId, speed, zone, emergencyVehicle: emergency })
      });
      const data = await r.json();

      if (data.error) {
        showResult('error', '⚠ ' + data.error);
      } else if (data.violation) {
        const v = data.record;
        showResult('violation',
          `🚨 VIOLATION RECORDED\n` +
          `━━━━━━━━━━━━━━━━━━━━━\n` +
          `ID       : #${v.id}\n` +
          `Vehicle  : ${v.vehicleId}\n` +
          `Speed    : ${v.speed.toFixed(1)} km/h\n` +
          `Zone     : ${v.zone}\n` +
          `Fine     : ₹${v.fine.toLocaleString()}\n` +
          `Saved to DB ✓`
        );
        loadViolations();
        // Clear fields
        document.getElementById('vehicleId').value = '';
        document.getElementById('speed').value = '';
        document.getElementById('zone').value = '';
        document.getElementById('emergency').checked = false;
      } else {
        showResult('clean',
          `✅ NO VIOLATION\n` +
          `━━━━━━━━━━━━━━━━━━━━━\n` +
          `Vehicle  : ${vehicleId.toUpperCase()}\n` +
          `Speed    : ${speed.toFixed(1)} km/h\n` +
          `Zone     : ${zone.toUpperCase()}\n` +
          (emergency ? `Status   : Emergency exempt` : `Status   : Within limit`)
        );
      }
    } catch(e) {
      showResult('error', '⚠ Server error. Please try again.');
    }

    btn.disabled = false;
    btn.innerHTML = 'PROCESS EVENT';
  }

  function showResult(type, msg) {
    const box = document.getElementById('resultBox');
    box.className = 'result-box ' + type;
    box.style.display = 'block';
    box.style.whiteSpace = 'pre';
    box.textContent = msg;
  }

  // ── Delete ──────────────────────────────────────────────────────────────────
  async function deleteSelected() {
    if (!selectedId) { alert('Select a row first.'); return; }
    if (!confirm(`Delete violation #${selectedId}?`)) return;
    try {
      const r = await fetch(`${API}/violations/${selectedId}`, { method: 'DELETE' });
      if (r.ok) { selectedId = null; loadViolations(); }
      else alert('Delete failed.');
    } catch(e) { alert('Server error.'); }
  }

  // ── Init ────────────────────────────────────────────────────────────────────
  loadViolations();
</script>
</body>
</html>
