# ── Server ────────────────────────────────────────────────────────────────────
# Railway injects PORT env variable automatically
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
# Railway PostgreSQL plugin injects DATABASE_URL automatically.
# Spring Boot parses it via the url below.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:trafficdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${PGUSER:sa}
spring.datasource.password=${PGPASSWORD:}

# Auto-detect driver from URL
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 console (local dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── App ───────────────────────────────────────────────────────────────────────
spring.application.name=SmartTrafficSystem
